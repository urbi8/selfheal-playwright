<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-container" id="app-container" data-testid="app-container">
    <h1 id="app-title" data-testid="app-title" aria-label="Todo App">Todo App</h1>

    <div class="input-row" id="input-row" data-testid="input-row">
      <input
        type="text"
        id="new-todo-input"
        class="new-todo-input"
        data-testid="new-todo-input"
        aria-label="New todo input"
        placeholder="What needs to be done?"
      />
      <button
        id="add-todo-btn"
        class="add-todo-btn"
        data-testid="add-todo-btn"
        aria-label="Add todo"
      >Add</button>
    </div>

    <ul id="todo-list" class="todo-list" data-testid="todo-list" aria-label="Todo list">
    </ul>

    <p id="empty-state" class="empty-state" data-testid="empty-state">No todos yet. Add one above!</p>
  </div>

  {{BREAKAGE_INJECTION}}
  <script src="/app.js"></script>
</body>
</html>
